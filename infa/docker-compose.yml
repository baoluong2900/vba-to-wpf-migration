# vba_brain — Docker Compose (Secured)
# Runs internal MongoDB and PostgreSQL databases safely using environment configurations.
#
# Usage:
#   docker compose up -d           → Launch all services (background)
#   docker compose down            → Terminate all services
#   docker compose logs -f mongo   → Monitor MongoDB logs
#   docker compose logs -f postgres→ Monitor PostgreSQL logs
#   docker compose ps              → Verify status of running containers
#
# MongoDB URI (with Authentication):
#   mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@<HOST>:27017/${MONGO_DATABASE}?authSource=admin
# PostgreSQL Connection String:
#   Host=<HOST>;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}

services:
  # ── MongoDB Service ────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: vba_brain_mongo
    restart: unless-stopped
    ports:
      - "0.0.0.0:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - ../data/mongo:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    command: mongod --bind_ip_all --wiredTigerCacheSizeGB 1

  # ── Mongo Express (Web admin panel UI) ──────────────────────────────────────
  # Access: http://localhost:8082
  # Credentials are populated dynamically via environmental variables
  mongo-express:
    image: mongo-express:1.0.2
    container_name: vba_brain_mongo_ui
    restart: unless-stopped
    ports:
      - "0.0.0.0:8082:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD}
    depends_on:
      - mongo

  # ── PostgreSQL Service ─────────────────────────────────────────────────────
  # Port binding: localhost:5432
  # Credentials are populated dynamically via environmental variables
  postgres:
    image: postgres:16-alpine
    container_name: vba_brain_postgres
    restart: unless-stopped
    ports:
      - "0.0.0.0:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    command: >
      postgres
        -c max_connections=100
        -c shared_buffers=256MB
        -c log_statement=ddl
