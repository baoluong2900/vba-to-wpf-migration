# vba_brain — Docker Compose
# Chạy MongoDB + PostgreSQL nội bộ để cả team dùng chung.
#
# Cách dùng:
#   docker compose up -d           → Khởi động tất cả services (background)
#   docker compose down            → Dừng tất cả
#   docker compose logs -f mongo   → Xem log MongoDB
#   docker compose logs -f postgres→ Xem log PostgreSQL
#   docker compose ps              → Kiểm tra trạng thái
#
# MongoDB URI (có auth):
#   mongodb://vba_brain:REDACTED_PASSWORD@<HOST>:27017/vba_brain_core?authSource=admin
# PostgreSQL connection string:
#   Host=<HOST>;Port=5432;Database=vba_brain;Username=vba_brain;Password=REDACTED_PASSWORD

services:
  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: vba_brain_mongo
    restart: unless-stopped
    ports:
      - "0.0.0.0:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: vba_brain
      MONGO_INITDB_ROOT_PASSWORD: REDACTED_PASSWORD
      MONGO_INITDB_DATABASE: vba_brain_core
    volumes:
      - ../data/mongo:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    command: mongod --bind_ip_all --wiredTigerCacheSizeGB 1

  # ── Mongo Express — Web UI ──────────────────────────────────────────────────
  # Truy cập: http://localhost:8082
  # Login: admin / REDACTED_PASSWORD
  mongo-express:
    image: mongo-express:1.0.2
    container_name: vba_brain_mongo_ui
    restart: unless-stopped
    ports:
      - "0.0.0.0:8082:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: vba_brain
      ME_CONFIG_MONGODB_ADMINPASSWORD: REDACTED_PASSWORD
      ME_CONFIG_MONGODB_URL: mongodb://vba_brain:REDACTED_PASSWORD@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: REDACTED_PASSWORD
    depends_on:
      - mongo

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  # Host: localhost:5432
  # User: vba_brain / REDACTED_PASSWORD
  # Database: vba_brain
  # Connection string (ADO.NET):
  #   Host=localhost;Port=5432;Database=vba_brain;Username=vba_brain;Password=REDACTED_PASSWORD
  postgres:
    image: postgres:16-alpine
    container_name: vba_brain_postgres
    restart: unless-stopped
    ports:
      - "0.0.0.0:5432:5432"
    environment:
      POSTGRES_USER: vba_brain
      POSTGRES_PASSWORD: REDACTED_PASSWORD
      POSTGRES_DB: vba_brain
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    command: >
      postgres
        -c max_connections=100
        -c shared_buffers=256MB
        -c log_statement=ddl
