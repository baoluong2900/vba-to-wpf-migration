name: ✨ Feature request
description: Propose a capability or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please check [`docs/UPGRADE_PLAN.md`](../../blob/main/docs/UPGRADE_PLAN.md) first — the
        tracked backlog may already cover this, in which case link the section instead.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Layer 1 — AST extraction
        - Layer 2 — BD/DD generation
        - Layer 3 — SQL migration
        - Layer 4 — Excel export
        - Layer 5 — Code generation
        - gRPC gateway
        - Web console (frontend)
        - Avalonia app (src/wpf)
        - Infrastructure / CI
        - Docs
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today? Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen instead, and roughly where in the codebase.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, and why they fall short.

  - type: input
    id: plan-ref
    attributes:
      label: Related UPGRADE_PLAN section
      placeholder: "e.g. §2.1 Test framework — leave blank if none"
