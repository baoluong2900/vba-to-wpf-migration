name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · lint & test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            src/backend/requirements.txt
            src/backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r src/backend/requirements.txt -r src/backend/requirements-dev.txt

      - name: Compile every Python module
        run: |
          python -m compileall -q \
            src/backend \
            start.py \
            start_wpf.py \
            clean_generated_files.py

      - name: Lint (ruff — correctness rules, see pyproject.toml)
        run: ruff check src/backend tests start.py start_wpf.py clean_generated_files.py infa/scripts

      - name: Unit tests
        run: pytest

      # Separate session: layer5 and layer2 both have a top-level `agents` package.
      - name: Unit tests (Layer 5)
        run: pytest tests/layer5

      - name: gRPC stubs match workflow.proto
        run: |
          set -e
          out=$(mktemp -d)
          python -m grpc_tools.protoc -I src/backend/protos \
            --python_out="$out" --grpc_python_out="$out" src/backend/protos/workflow.proto
          if ! diff -q "$out/workflow_pb2.py" src/backend/api_gateway/workflow_pb2.py \
             || ! diff -q "$out/workflow_pb2_grpc.py" src/backend/api_gateway/workflow_pb2_grpc.py; then
            echo "::error::src/backend/api_gateway/workflow_pb2*.py are stale - regenerate them (see CONTRIBUTING.md)."
            exit 1
          fi
          echo "OK - stubs are up to date."

  frontend:
    name: Frontend · lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: src/frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: yarn test

      - name: Production build
        run: yarn build

  dotnet:
    name: Avalonia app · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build solution
        run: dotnet build src/wpf/vba_brain.slnx

      - name: No vulnerable NuGet packages
        run: |
          set -e
          report=$(dotnet list src/wpf/vba_brain.slnx package --vulnerable --include-transitive)
          echo "$report"
          if echo "$report" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet packages found - upgrade or pin a patched version."
            exit 1
          fi

  hygiene:
    name: Hygiene · secrets & artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: No secret files are tracked
        run: |
          set -e
          tracked=$(git ls-files \
            'config.json' '.env' '.env.*' '**/.env' '**/.env.*' \
            'appsettings.json' '**/appsettings.json' \
            | grep -v '\.example' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Secret-bearing files are tracked by git:"
            echo "$tracked"
            exit 1
          fi
          echo "OK - no secret files tracked."

      - name: No raw data exports or build artifacts are tracked
        run: |
          set -e
          tracked=$(git ls-files \
            'data/**' 'src/excel_outputs/**' \
            '**/node_modules/**' '**/.next/**' \
            '**/bin/**' '**/obj/**' '**/__pycache__/**' \
            '**/scratch/**' 'src/backend/logs/**' 'src/backend/workflow/layer5/logs/**' \
            'src/backend/workflow/layer2/output/**' 'src/backend/workflow/layer2/agents/output/**' \
            'src/frontend/reports/**' \
            'src/backend/workflow/layer5/agents/repo/outputs/*.json' 'src/backend/workflow/layer5/agents/repo/outputs/*/**' \
            'src/backend/workflow/layer5/agents/service/outputs/**' 'src/backend/workflow/layer5/agents/service/inputs/**' \
            'src/backend/workflow/layer5/agents/graphview/outputs/review_*.json' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Generated or sensitive paths are tracked by git:"
            echo "$tracked" | head -40
            exit 1
          fi
          echo "OK - no generated or sensitive paths tracked."

      - name: Config templates exist
        run: |
          set -e
          for f in config.example.json infa/.env.example .env.example; do
            test -f "$f" || { echo "::error::Missing template: $f"; exit 1; }
          done
          echo "OK - all config templates present."

      - name: Docker ports stay bound to loopback
        run: |
          set -e
          if grep -nE '^\s*-\s*"0\.0\.0\.0:' infa/docker-compose.yml; then
            echo "::error::infa/docker-compose.yml exposes a port on 0.0.0.0 - keep bindings on 127.0.0.1 (see SECURITY.md)."
            exit 1
          fi
          echo "OK - all published ports bound to 127.0.0.1."
